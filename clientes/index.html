<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        try {
          var k = "theme";
          var t = localStorage.getItem(k);
          if (t === "dark") document.documentElement.classList.add("dark");
          else if (t === "light") document.documentElement.classList.remove("dark");
          else {
            var a = localStorage.getItem("admin_theme_mode");
            var d = localStorage.getItem("driver_theme_mode");
            var L = a || d;
            if (L === "dark") document.documentElement.classList.add("dark");
            else if (L === "light") document.documentElement.classList.remove("dark");
            else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.remove("dark");
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <title>Menahariya Smart</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
